<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
  <meta name="theme-color" content="#111418">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>B2K Remote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="connect" class="primary">Connect</button>
    <span id="status" class="status" data-state="disconnected">Disconnected</span>
    <span id="caps" class="badge" hidden>CAPS</span>
    <button id="settings-toggle" class="icon" aria-label="Settings" aria-expanded="false">⚙</button>
  </header>

  <div id="unsupported" class="banner" hidden>
    This page needs Web Bluetooth: Chrome or Edge on desktop or Android, served over HTTPS or
    from localhost. On iOS, use the Bluefy browser.
  </div>

  <section id="settings" class="settings" hidden>
    <label>Pointer speed
      <input id="sensitivity" type="range" min="0.3" max="4" step="0.1">
    </label>
    <label>Scroll speed
      <input id="scroll-speed" type="range" min="0.3" max="3" step="0.1">
    </label>
    <label class="check"><input id="natural-scroll" type="checkbox"> Natural scrolling</label>
    <label class="check"><input id="double-space" type="checkbox"> Double space types a period</label>
    <label class="check"><input id="show-history" type="checkbox"> Show typing history (hide when typing passwords)</label>
    <button id="disconnect">Disconnect</button>
  </section>

  <div id="history" class="history" aria-label="Recently sent keys"></div>

  <main>
    <div id="pad" class="pad">
      <span class="pad-hint">Tap = click · 2 fingers = right click / scroll · tap-then-drag = drag</span>
    </div>

    <div id="mouse-buttons" class="mouse-buttons">
      <button data-button="left">L</button>
      <button data-button="middle">M</button>
      <button data-button="right">R</button>
    </div>

    <div id="keybar" class="keybar">
      <div class="row">
        <button data-code="Escape">Esc</button>
        <button data-code="Tab">Tab</button>
        <button data-mod="ctrl">Ctrl</button>
        <button data-mod="alt">Alt</button>
        <button data-mod="shift">Shift</button>
        <button data-mod="gui">Win</button>
        <button id="kbd-toggle" class="primary wide">⌨</button>
      </div>
      <div class="row">
        <button data-code="Home">Home</button>
        <button data-code="End">End</button>
        <button data-code="PageUp">PgUp</button>
        <button data-code="PageDown">PgDn</button>
        <button data-code="Delete">Del</button>
        <button data-code="Backspace">⌫</button>
        <button data-code="Enter">⏎</button>
      </div>
      <div class="row">
        <button id="fn-toggle" aria-expanded="false">Fn</button>
        <button data-consumer="0xe2">🔇</button>
        <button data-consumer="0xea">🔉</button>
        <button data-consumer="0xe9">🔊</button>
        <button data-consumer="0xb6">⏮</button>
        <button data-consumer="0xcd">⏯</button>
        <button data-consumer="0xb5">⏭</button>
      </div>
      <div class="row arrows">
        <button data-code="ArrowLeft">←</button>
        <button data-code="ArrowUp">↑</button>
        <button data-code="ArrowDown">↓</button>
        <button data-code="ArrowRight">→</button>
      </div>
      <div id="fn-row" class="row fn" hidden>
        <button data-code="F1">F1</button><button data-code="F2">F2</button>
        <button data-code="F3">F3</button><button data-code="F4">F4</button>
        <button data-code="F5">F5</button><button data-code="F6">F6</button>
        <button data-code="F7">F7</button><button data-code="F8">F8</button>
        <button data-code="F9">F9</button><button data-code="F10">F10</button>
        <button data-code="F11">F11</button><button data-code="F12">F12</button>
        <button data-code="PrintScreen">PrtSc</button>
        <button data-code="Insert">Ins</button>
      </div>
    </div>
  </main>

  <textarea id="typing" class="typing" autocomplete="off" autocorrect="off"
            autocapitalize="off" spellcheck="false" aria-label="Type to send keystrokes"></textarea>

  <script type="module" src="app.js"></script>
</body>
</html>
